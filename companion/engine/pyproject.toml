[project]
name = "lyrics-forced-aligner"
version = "0.2.27"
description = "Local multilingual lyrics-to-audio alignment for singing"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "demucs>=4.0.1",
  "fastapi>=0.116.0",
  "faster-whisper>=1.2.1",
  "lingua-language-detector>=2.1.1,<3",
  "numpy>=2.1.0",
  "opencc-python-reimplemented>=0.1.7",
  "python-multipart>=0.0.20",
  "qwen-asr==0.0.6",
  "soundfile>=0.12.1",
  "uvicorn[standard]>=0.35.0",
]

[project.optional-dependencies]
verify = [
  "whisperx>=3.7.4",
]
test = [
  "pytest>=8.4.0",
]
train = [
  "datasets>=4.4.0,<5",
  "peft>=0.18.0,<0.19",
]

[project.scripts]
lyrics-align = "lyrics_aligner.cli:main"
lyrics-align-web = "lyrics_aligner.server:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lyrics_aligner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
