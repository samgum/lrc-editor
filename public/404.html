<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex" />
        <title>Page not found · LRC Editor</title>
        <style>
        :root {
            color-scheme: light dark;
            font-family: system-ui, sans-serif;
        }
        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            place-items: center;
        }
        main {
            text-align: center;
        }
        a {
            color: #ae4b69;
        }
        @media (prefers-color-scheme: dark) {
            a {
                color: #f58ea8;
            }
        }
        </style>
    </head>
    <body>
        <main>
            <h1>Page not found</h1>
            <a id="app-root" href="/">Open LRC Editor</a>
        </main>
        <script>
        const p = location.pathname;
            const base = p === "/lrc-editor" || p.startsWith("/lrc-editor/") ? "/lrc-editor/" : "/";
            const link = document.getElementById("app-root");
            if (link) link.href = base;
        </script>
    </body>
</html>
