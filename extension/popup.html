<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>LRC Editor Media Bridge</title>
        <link rel="stylesheet" href="./src/popup.css">
    </head>
    <body>
        <header>
            <img src="/icons/icon-192.png" width="40" height="40" alt="">
            <strong data-i18n="extensionName">LRC Editor Media Bridge</strong>
        </header>
        <main>
            <span data-i18n="supportedSources">Supported sources</span>
            <ul>
                <li>YouTube</li>
                <li>Bilibili</li>
                <li data-i18n="neteaseShareLinks">NetEase share links</li>
                <li data-i18n="localAiAlignment">Local AI alignment</li>
            </ul>
        </main>
        <a
            class="open-editor"
            href="https://lrc.sgmy.org/"
            target="_blank"
            rel="noopener noreferrer"
            data-i18n="openEditor"
        >
            Open LRC Editor
        </a>
        <script type="module" src="./src/popup.ts"></script>
    </body>
</html>
